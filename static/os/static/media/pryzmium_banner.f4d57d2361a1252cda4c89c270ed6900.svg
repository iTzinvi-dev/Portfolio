<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="340" rx="12" fill="#1e1a18" stroke="#3d332d" stroke-width="2"/>
  
  <!-- Retro terminal header bar -->
  <rect width="600" height="32" rx="12" fill="#28221f"/>
  <rect y="20" width="600" height="12" fill="#28221f"/>
  <circle cx="20" cy="16" r="5" fill="#f85149"/>
  <circle cx="36" cy="16" r="5" fill="#e3b341"/>
  <circle cx="52" cy="16" r="5" fill="#2ea043"/>
  <text x="75" y="20" fill="#a89a90" font-family="'Courier New', monospace" font-size="12" font-weight="bold">pryzmium-core :: multi-gateway-inference</text>

  <!-- Background grid pattern -->
  <defs>
    <pattern id="pgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2d2622" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="pryzmGrad" x1="40" y1="14" x2="88" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E87A5D" />
      <stop offset="100%" stop-color="#B84B30" />
    </linearGradient>
  </defs>
  <rect y="32" width="600" height="308" fill="url(#pgrid)" opacity="0.6"/>

  <!-- Left: Official Pryzmium Prism Logo -->
  <g transform="translate(35, 60)">
    <rect width="130" height="130" rx="26" fill="#231F1D" stroke="#D97757" stroke-width="2"/>
    <g transform="translate(15, 15) scale(1)">
      <path
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M22 14 H64 L88 42 L56 66 H40 V88 H22 V14 Z M40 30 V52 L64 42 L40 30 Z"
        fill="#FFFFCC"
      />
      <path
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M40 14 H64 L88 42 L56 66 L40 52 V30 L64 42 L40 14 Z"
        fill="url(#pryzmGrad)"
      />
      <circle cx="72" cy="76" r="7" fill="#D97757" />
    </g>
    <text x="65" y="155" text-anchor="middle" fill="#E87A5D" font-family="'Courier New', monospace" font-size="12" font-weight="bold">PRYZMIUM LOGO</text>
  </g>

  <!-- Right: Title & Feature Tags -->
  <g transform="translate(195, 65)">
    <text x="0" y="24" fill="#E87A5D" font-family="'Courier New', monospace" font-size="22" font-weight="900" letter-spacing="1">PRYZMIUM</text>
    <text x="0" y="44" fill="#bdaea3" font-family="'Courier New', monospace" font-size="12">Autonomous Multi-Model AI Agent Workspace</text>

    <!-- Governance & Gateway Badges -->
    <g transform="translate(0, 65)">
      <!-- Badge 1: 8 AI Gateways -->
      <rect x="0" y="0" width="175" height="26" rx="4" fill="#2d221c" stroke="#E87A5D" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#E87A5D"/>
      <text x="24" y="17" fill="#ffffcc" font-family="'Courier New', monospace" font-size="11" font-weight="bold">8 AI GATEWAYS</text>

      <!-- Badge 2: AES-256 Vault -->
      <rect x="190" y="0" width="185" height="26" rx="4" fill="#2d221c" stroke="#10b981" stroke-width="1"/>
      <circle cx="202" cy="13" r="4" fill="#10b981"/>
      <text x="214" y="17" fill="#ffffcc" font-family="'Courier New', monospace" font-size="11" font-weight="bold">AES-256 TOKEN VAULT</text>

      <!-- Badge 3: Human Confirmation -->
      <rect x="0" y="38" width="175" height="26" rx="4" fill="#2d221c" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="12" cy="51" r="4" fill="#f59e0b"/>
      <text x="24" y="55" fill="#ffffcc" font-family="'Courier New', monospace" font-size="11" font-weight="bold">CONFIRMATION GATES</text>

      <!-- Badge 4: Workspace Connectors -->
      <rect x="190" y="38" width="185" height="26" rx="4" fill="#2d221c" stroke="#60a5fa" stroke-width="1"/>
      <circle cx="202" cy="51" r="4" fill="#60a5fa"/>
      <text x="214" y="55" fill="#ffffcc" font-family="'Courier New', monospace" font-size="11" font-weight="bold">WORKSPACE TOOLS</text>
    </g>

    <!-- Capabilities line -->
    <g transform="translate(0, 155)">
      <text x="0" y="0" fill="#a89a90" font-family="'Courier New', monospace" font-size="10" font-weight="bold">INTEGRATED CONNECTORS:</text>
      <text x="0" y="18" fill="#d6c7bc" font-family="'Courier New', monospace" font-size="11">Google Drive • Docs • Gmail • Calendar • Tasks • Web Search</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <rect y="295" width="600" height="45" fill="#28221f"/>
  <line x1="0" y1="295" x2="600" y2="295" stroke="#3d332d" stroke-width="1"/>
  <text x="20" y="322" fill="#E87A5D" font-family="'Courier New', monospace" font-size="12" font-weight="bold">GOVERNANCE ENGINE: ACTIVE &amp; VERIFIED ✓</text>
  <text x="440" y="322" fill="#f59e0b" font-family="'Courier New', monospace" font-size="12">REACT 19 + EXPRESS</text>
</svg>
