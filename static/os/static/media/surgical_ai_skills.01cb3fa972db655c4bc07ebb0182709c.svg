<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="340" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  
  <!-- Retro terminal header bar -->
  <rect width="600" height="32" rx="12" fill="#161b22"/>
  <rect y="20" width="600" height="12" fill="#161b22"/>
  <circle cx="20" cy="16" r="5" fill="#f85149"/>
  <circle cx="36" cy="16" r="5" fill="#e3b341"/>
  <circle cx="52" cy="16" r="5" fill="#2ea043"/>
  <text x="75" y="20" fill="#8b949e" font-family="'Courier New', monospace" font-size="12" font-weight="bold">surgical-cli --protocol=root-cause</text>

  <!-- Background grid pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262d" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect y="32" width="600" height="308" fill="url(#grid)" opacity="0.6"/>

  <!-- Left: Surgical Shield & Crosshair Emblem -->
  <g transform="translate(40, 60)">
    <!-- Outer Shield Shape -->
    <path d="M 60 10 L 110 32 V 90 C 110 135 60 165 60 165 C 60 165 10 135 10 90 V 32 Z" fill="#161b22" stroke="url(#shieldGrad)" stroke-width="3"/>
    
    <!-- Laser / Scalpel Crosshair -->
    <circle cx="60" cy="85" r="32" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
    <line x1="60" y1="42" x2="60" y2="128" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="17" y1="85" x2="103" y2="85" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Surgical Scalpel Centerpiece -->
    <path d="M 52 110 L 68 55 L 63 50 L 52 100 Z" fill="#e2e8f0"/>
    <path d="M 68 55 L 60 38 L 57 44 L 63 50 Z" fill="#38bdf8"/>
    <circle cx="60" cy="85" r="5" fill="#10b981"/>
  </g>

  <!-- Right: Title & Feature Tags -->
  <g transform="translate(180, 70)">
    <text x="0" y="24" fill="#58a6ff" font-family="'Courier New', monospace" font-size="20" font-weight="900" letter-spacing="1">SURGICAL AI SKILLS</text>
    <text x="0" y="44" fill="#8b949e" font-family="'Courier New', monospace" font-size="12">Deterministic Agent Guardrails &amp; Blast Radius CLI</text>

    <!-- Terminal Protocol Badges -->
    <g transform="translate(0, 65)">
      <!-- Badge 1: Root Cause -->
      <rect x="0" y="0" width="180" height="26" rx="4" fill="#1f2937" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#38bdf8"/>
      <text x="24" y="17" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="11" font-weight="bold">ROOT-CAUSE TRACING</text>

      <!-- Badge 2: Anti-Bandaid -->
      <rect x="195" y="0" width="185" height="26" rx="4" fill="#1f2937" stroke="#10b981" stroke-width="1"/>
      <circle cx="207" cy="13" r="4" fill="#10b981"/>
      <text x="219" y="17" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="11" font-weight="bold">ANTI-BANDAID LINT</text>

      <!-- Badge 3: 2-Strike Rollback -->
      <rect x="0" y="38" width="180" height="26" rx="4" fill="#1f2937" stroke="#f43f5e" stroke-width="1"/>
      <circle cx="12" cy="51" r="4" fill="#f43f5e"/>
      <text x="24" y="55" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="11" font-weight="bold">2-STRIKE ROLLBACK</text>

      <!-- Badge 4: Blast-Radius -->
      <rect x="195" y="38" width="185" height="26" rx="4" fill="#1f2937" stroke="#eab308" stroke-width="1"/>
      <circle cx="207" cy="51" r="4" fill="#eab308"/>
      <text x="219" y="55" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="11" font-weight="bold">BLAST-RADIUS CHECK</text>
    </g>

    <!-- Supported Platform Chips -->
    <g transform="translate(0, 155)">
      <text x="0" y="0" fill="#7d8590" font-family="'Courier New', monospace" font-size="10" font-weight="bold">SUPPORTED AGENT PLATFORMS:</text>
      <text x="0" y="18" fill="#c9d1d9" font-family="'Courier New', monospace" font-size="11">Claude Code • Cursor • Windsurf • Copilot • Codex • OpenClaw</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <rect y="295" width="600" height="45" fill="#161b22"/>
  <line x1="0" y1="295" x2="600" y2="295" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="322" fill="#10b981" font-family="'Courier New', monospace" font-size="12" font-weight="bold">STATUS: ACTIVE GUARDRAIL PROTOCOL VERIFIED ✓</text>
  <text x="440" y="322" fill="#58a6ff" font-family="'Courier New', monospace" font-size="12">v2.4.0 (STABLE)</text>
</svg>
