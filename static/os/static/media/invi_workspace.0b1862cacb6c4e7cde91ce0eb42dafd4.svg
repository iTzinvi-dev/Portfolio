<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal Window -->
  <rect x="20" y="20" width="560" height="300" rx="10" fill="url(#termBg)" stroke="#48bfe3" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="20" y="20" width="560" height="32" rx="10" fill="#000814"/>
  <rect x="20" y="42" width="560" height="10" fill="#000814"/>
  <circle cx="45" cy="36" r="6" fill="#ff5f56"/>
  <circle cx="65" cy="36" r="6" fill="#ffbd2e"/>
  <circle cx="85" cy="36" r="6" fill="#27c93f"/>
  <text x="300" y="41" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#8892b0">
    invi@security-ops:~ (bash)
  </text>

  <!-- Terminal Content -->
  <text x="45" y="80" font-family="'Courier New', monospace" font-size="13" fill="#64ffda" filter="url(#cyanGlow)">
    $ ./invi_init.sh --profile "iTzinvi"
  </text>
  <text x="45" y="105" font-family="'Courier New', monospace" font-size="12" fill="#a0aec0">
    [✓] Loading Core Modules: Automation Engine, Security Audits, Dev Frameworks
  </text>
  <text x="45" y="130" font-family="'Courier New', monospace" font-size="12" fill="#48bfe3">
    [+] Roles Active: [1] Automation Specialist  [2] Software Developer  [3] CyberSec
  </text>
  <text x="45" y="155" font-family="'Courier New', monospace" font-size="12" fill="#a0aec0">
    [+] GitHub: https://github.com/iTzinvi-dev
  </text>
  <text x="45" y="180" font-family="'Courier New', monospace" font-size="12" fill="#a0aec0">
    [+] Email: itzinvi.official@gmail.com
  </text>
  <text x="45" y="205" font-family="'Courier New', monospace" font-size="12" fill="#52b788">
    [✓] Status: Systems Secure &amp; Operational.
  </text>

  <!-- ASCII Art box -->
  <rect x="45" y="225" width="510" height="75" fill="#03071e" rx="6" stroke="#2a4365" stroke-width="1"/>
  <text x="65" y="250" font-family="'Courier New', monospace" font-size="11" fill="#64ffda">
    &gt; "وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ"
  </text>
  <text x="65" y="275" font-family="'Courier New', monospace" font-size="11" fill="#718096">
    &gt; Building innovative solutions, securing digital boundaries.
  </text>
</svg>